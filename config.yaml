grid_map:
  FREE_SPACE: 0
  OBSTACLE: 1

default_env_setting: [2, 10]
max_num_agents: 72
max_map_length: 100
agent_increment: 1
map_increment: 5
upgrade_rate: 0.9
curriculum_window: 200
obstacle_density: [0, 0.33, 0.5]

reward_fn:
  'move': -0.075
  'stay_on_goal': 0
  'stay_off_goal': -0.075
  'collision': -0.5
  'reach_goal': 3
reward_shaping: true
lambda_hurl: 0.1
gamma: 0.95

obs_radius: 4
K_obs: 3
heuristic_norm: relative

action_mapping:
  0: [0, 0]
  1: [-1, 0]
  2: [1, 0]
  3: [0, -1]
  4: [0, 1]
action_dim: 5

num_channels: 64
hidden_dim: 256
num_attn_heads: 4
use_comm: false
num_gcn_layers: 2

lr_pi: 3.0e-4
lr_q: 3.0e-4
tau: 0.005
alpha: 0.1
actor_loss: score
grad_clip: 10

buffer_capacity: 2048
learning_threshold: 10000
batch_agents: 256
max_batch_sequences: 64
seq_len: 16
burn_in: 4
max_episode_length: 256
prefetch_batches: 4

num_updates: 600000
num_workers: 16
steps_per_sync: 400
weights_publish_interval: 10
save_interval: 2000
save_path: './models'
log_interval: 10

test_settings:
  - ['random32', 4]
  - ['random32', 8]
  - ['random32', 16]
  - ['random32', 32]
  - ['random32', 64]
  - ['random64', 4]
  - ['random64', 8]
  - ['random64', 16]
  - ['random64', 32]
  - ['random64', 64]
  - ['den312d', 4]
  - ['den312d', 8]
  - ['den312d', 16]
  - ['den312d', 32]
  - ['den312d', 64]
  - ['warehouse', 4]
  - ['warehouse', 8]
  - ['warehouse', 16]
  - ['warehouse', 32]
  - ['warehouse', 64]
max_timesteps:
  'random32': 256
  'random64': 256
  'den312d': 256
  'warehouse': 512
num_instances_per_test: 300
